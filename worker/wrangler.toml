# Care Log bridge: a small Cloudflare Worker on the free plan.
# It is the app's keyholder and its inbox: secrets live here, never in the public site.
name = "care-log-bridge"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Secrets (set by the deploy workflow from GitHub repository secrets, never committed):
#   BRIDGE_KEY               shared key Health Auto Export sends in the X-Care-Log-Key header
#   FIREBASE_SERVICE_ACCOUNT the Firebase service account JSON (Project settings > Service accounts)
#   VAPID_PRIVATE_KEY        the Web Push signing key as JWK JSON (tools/vapid_keys.mjs); its public
#                            half is window.DAYBOOK_PUSH.publicKey in config.js
#   ANTHROPIC_API_KEY        the key for "Explain in Daybook" (console.anthropic.com, a one-off credit);
#                            without it the /explain route answers "not switched on yet"
#   BETA_PHONE               optional: Mark's phone number for Beta testers, shown inside the Feedback sheet
#                            to signed-in members only, never on the website
#   RESEND_API_KEY           the key for Send to the team by email (resend.com, free tier; the domain
#                            mymedicaldaybook.co.uk verified there); without it /send-report answers
#                            "not switched on yet" and the app offers the share sheet instead

# Public settings. DEMO_PROJECT_ID is the shared demo's Firebase project (already public in
# config.js); its guest sign-in may use Explain in Daybook with its own smaller daily limit.
# BETA_CODES_REQUIRED: while set, a new household needs a Beta code (betaCodes/{CODE}, made with the
# Household admin workflow). Delete the line when the app is on the stores and sign-up opens.
[vars]
DEMO_PROJECT_ID = "daybook-demo-34eae"
BETA_CODES_REQUIRED = "yes"
# SEND_FROM: the address the reports are emailed from; replies go to the sender's own address, never here.
SEND_FROM = "reporting@mymedicaldaybook.co.uk"

# Medicine reminders: the check runs every five minutes (free plan allows cron triggers)
[triggers]
crons = ["*/5 * * * *"]
