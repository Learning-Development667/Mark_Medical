# Builds data/dmd.json (medicine names from the NHS dm+d, for the suggestions in Add medicine) and commits it when it
# changes. Monthly, on the first Monday, and by hand from the Actions tab. Needs the TRUD_API_KEY secret.
# The log shows the release name and counts only.
name: Build medicines list

on:
  schedule:
    - cron: '17 6 1-7 * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the list
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
        run: node tools/build_dmd.mjs
      - name: Commit the list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dmd.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh data/dmd.json from the NHS dm+d"
          git push
