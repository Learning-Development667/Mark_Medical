# Builds the iPhone app (native/, Capacitor) with the web app inside it and sends it to TestFlight (v395).
# Run by hand from the Actions tab for now. Needs the APP_STORE_CONNECT_API_KEY (the .p8 text),
# APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APPLE_TEAM_ID secrets. Signing is automatic:
# the archive is built unsigned and signed for the App Store at the export, where Xcode creates the distribution
# certificate and profile through the API key (a development profile would need a registered iPhone). The log never shows the key.
name: iPhone app to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    # xcode-27 (v412): the foldable iPhone letterboxes apps built before its SDK, which arrived in Xcode 27.1; macos-15
    # and macos-26 only carry Xcode 26
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Choose Xcode
        # pinned to the released 27.1, never a release candidate (App Store Connect refuses those)
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version && xcodebuild -showsdks | grep iphoneos
      - name: Copy the web app into the iPhone project
        working-directory: native
        run: npm ci && node scripts/copy-web.mjs && npx cap sync ios
      - name: Write the API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Build and archive
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Daybook.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40
          test -d "$RUNNER_TEMP/Daybook.xcarchive"
      - name: Put the notifications entitlement on the app
        # The archive is built unsigned, so it carries no entitlements; an ad-hoc signature with App.entitlements
        # (aps-environment, v398) gives the export something to keep when it signs for the App Store.
        run: |
          APP="$RUNNER_TEMP/Daybook.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements native/ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP" | grep -q aps-environment
      - name: Send to TestFlight
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Daybook.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # Hands the build to the testers (v411): waits for Apple's processing, sets What to Test from native/ios/what-to-test.txt,
  # adds it to Circle Testers and asks for beta review. On Linux, so the wait costs no Mac minutes. Prints ids and states only.
  testers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write the API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Write the release notes
        run: node tools/release_notes.mjs "$RUNNER_TEMP/notes"
      - name: Give the build to Circle Testers
        env:
          NOTES_FILE: ${{ runner.temp }}/notes/testflight.txt
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/testflight_group.mjs
      - name: Remove the key again
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
