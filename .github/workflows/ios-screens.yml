# Screenshots of Daybook on Apple's iPhone simulators (v416): the iPhone SE, a standard size, the Pro Max and the iPhone Duo,
# light and dark, the app's opening screen and every tab of the cancer preview in Safari. Builds for the simulator only:
# nothing is signed and nothing goes to TestFlight. Run with the daily build; the pictures are kept as the run's artifact.
name: iPhone screenshots on the simulators

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Choose Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Copy the web app into the iPhone project
        working-directory: native
        run: npm ci && node scripts/copy-web.mjs && npx cap sync ios
      - name: Build for the simulator
        working-directory: native/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -20
          ls -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
      - name: Take the screenshots
        run: bash tools/sim_shots.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/shots"
      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screens-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          retention-days: 14
