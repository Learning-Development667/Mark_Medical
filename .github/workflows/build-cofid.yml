# Builds data/cofid.json from the official UK CoFID spreadsheet (gov.uk) and commits it.
# Run by hand from the Actions tab whenever the dataset needs refreshing (it changes rarely).
name: Build CoFID food table

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python tools/build_cofid.py
      - name: Commit the table if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cofid.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh data/cofid.json from the official CoFID spreadsheet"
          git push
