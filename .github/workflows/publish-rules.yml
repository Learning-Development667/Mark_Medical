# Publishes the database rules from the repository to Firebase, so the file in git is always what
# is live and nobody pastes into the console. Real project: firestore.rules with the bridge's
# FIREBASE_SERVICE_ACCOUNT. Demo project: firestore.demo.rules with DEMO_SERVICE_ACCOUNT.
# The service account needs the Firebase Rules Admin role (the default Admin SDK account has it).
name: Publish database rules

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which project"
        required: true
        type: choice
        default: real
        options:
          - real
          - demo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish
        env:
          SA: ${{ inputs.target == 'demo' && secrets.DEMO_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$SA" ]; then echo "::error::The service account secret for $TARGET is not set"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$RUNNER_TEMP/sa.json")
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          CONFIG=firebase.json
          [ "$TARGET" = "demo" ] && CONFIG=firebase.demo.json
          echo "Publishing $( [ "$TARGET" = demo ] && echo firestore.demo.rules || echo firestore.rules ) to $PROJECT"
          npx --yes firebase-tools@15 deploy --only firestore:rules --project "$PROJECT" --config "$CONFIG" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
