# Publishes the database rules from the repository to Firebase, so the file in git is always what
# is live and nobody pastes into the console. Real project: firestore.rules with the bridge's
# FIREBASE_SERVICE_ACCOUNT. Demo project: firestore.demo.rules with DEMO_SERVICE_ACCOUNT.
# Goes through the Firebase Rules REST API (tools/publish_rules.mjs) rather than firebase-tools,
# whose deploy first asks Service Usage a question the Admin SDK service account may not ask.
name: Publish database rules

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which project"
        required: true
        type: choice
        default: real
        options:
          - real
          - demo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish
        env:
          SERVICE_ACCOUNT: ${{ inputs.target == 'demo' && secrets.DEMO_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          RULES_FILE: ${{ inputs.target == 'demo' && 'firestore.demo.rules' || 'firestore.rules' }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "::error::The service account secret for ${{ inputs.target }} is not set"; exit 1; fi
          node tools/publish_rules.mjs
