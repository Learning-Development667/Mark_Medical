# Runs the break-in tests for firestore.rules (tests/rules/) on Google's Firestore emulator,
# whenever the rules or the tests change. Nothing here touches a real database or needs a secret.
name: Rules tests

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json', 'tests/rules/**', '.github/workflows/rules-test.yml']
  pull_request:
    paths: ['firestore.rules', 'firebase.json', 'tests/rules/**']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        working-directory: tests/rules
        run: npm ci --no-audit --no-fund
      - name: Break-in tests on the emulator
        working-directory: tests/rules
        run: npm test
