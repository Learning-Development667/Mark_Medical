# Household admin from the Actions tab (replaces "Seed a user record" since v75): create a
# household, add or remove a member, make a fresh Apple Health inbox key, make or switch off a Beta
# code (one per route in: a ward, a clinic, a WhatsApp group), or list them all.
# Uses the bridge's FIREBASE_SERVICE_ACCOUNT secret; nothing secret is typed in or printed.
name: Household admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: list
        options:
          - list
          - create
          - add-member
          - remove-member
          - new-key
          - beta-code
          - beta-codes
          - unseed-check
          - unseed
          - food-check
          - dose-use-check
          - dose-use
      code:
        description: "Beta code to make or switch off (beta-code): letters and digits, e.g. BINCEY"
        required: false
        type: string
      label:
        description: "Where the Beta code goes (beta-code), e.g. Bincey's patients"
        required: false
        type: string
      switch_off:
        description: "beta-code: switch this code off (named switch_off, since a bare off is read as the word false in YAML)"
        required: false
        type: boolean
        default: false
      household_id:
        description: "Household id (add-member, remove-member, new-key)"
        required: false
        type: string
      household_name:
        description: "Household name (create)"
        required: false
        type: string
      uid:
        description: "Sign-in UID (copy from Authentication > Users, 28 characters)"
        required: false
        type: string
      name:
        description: "First name shown in the app"
        required: false
        type: string
      role:
        description: "Access (add-member)"
        required: false
        type: choice
        default: family
        options:
          - family
          - readonly
          - viewer
      relation:
        description: "Who they are"
        required: false
        type: choice
        default: none
        options:
          - none
          - patient
          - carer
      move:
        description: "add-member: move a sign-in that is already in another household"
        required: false
        type: boolean
        default: false
      dose_use:
        description: "dose-use-check / dose-use: Medicine | from-to | use inside | use outside, e.g. Diazepam | 21:00-01:00 | Sleep | Pain"
        required: false
        type: string
      all_circles:
        description: "unseed-check / unseed: every circle, not only those with a Beta code (give Mark's circle as household_id to leave it alone)"
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ${{ inputs.action }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACTION: ${{ inputs.action }}
          HOUSEHOLD_ID: ${{ inputs.household_id }}
          HOUSEHOLD_NAME: ${{ inputs.household_name }}
          OWNER_UID: ${{ inputs.uid }}
          OWNER_NAME: ${{ inputs.name }}
          OWNER_RELATION: ${{ inputs.relation }}
          USER_UID: ${{ inputs.uid }}
          NAME: ${{ inputs.name }}
          ROLE: ${{ inputs.role }}
          RELATION: ${{ inputs.relation }}
          MOVE: ${{ inputs.move && 'yes' || 'no' }}
          CODE: ${{ inputs.code }}
          LABEL: ${{ inputs.label }}
          OFF: ${{ inputs.switch_off && 'yes' || 'no' }}
          ALL: ${{ inputs.all_circles && 'yes' || 'no' }}
          DOSE_USE: ${{ inputs.dose_use }}
        run: node tools/household_admin.mjs
